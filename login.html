<!doctype html>
<html lang="en" class="fs1">
<head>
<script>
/* GitHub Pages project base — 改 repo 名必須改 REPO；唔好同 /members/ 舊會員站混淆 */
(function(){var REPO="members-shop";var p=location.pathname;var base="./";if(p==="/"+REPO||p.indexOf("/"+REPO+"/")===0){base="/"+REPO+"/";}else{var i=p.lastIndexOf("/");if(i>=0)base=p.slice(0,i+1)||"./";}document.write('<base href="'+base+'">');window.__SITE_BASE__=base;})();

</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; style-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b3c5d">
<title>Login | 3D Shop</title>
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body data-page="login" data-title="loginTitle">
<a class="skip" href="#main" data-i18n="skip">Skip to main content</a>
<div id="demoBanner" class="demo-banner" hidden></div>
<header class="top" id="siteHeader" aria-busy="true"></header>

<main id="main" class="narrow" tabindex="-1">
<div class="card">
<h1 data-i18n="loginTitle">Member login</h1>
<form id="f" novalidate>
<label for="email" data-i18n="email">Email address</label>
<input id="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
<label for="pw" data-i18n="password">Password</label>
<input id="pw" class="pw" type="password" autocomplete="current-password" required>
<label class="chk"><input type="checkbox" id="showpw" data-showpw> <span data-i18n="showPw">Show password</span></label>
<button type="submit" id="submit" class="btn primary block" data-i18n="loginBtn">Log in</button>
</form>
<div id="msg" class="msg" aria-live="polite" hidden></div>
<div class="links">
<p><a href="forgot.html" data-i18n="forgotLink">Forgot password?</a></p>
<p><span data-i18n="noAccount">No account yet?</span> <a href="signup.html" data-i18n="signupLink">Sign up</a></p>
</div>
</div>
</main>

<footer>
  <a href="privacy.html" data-i18n="navPrivacy">Privacy</a>
  · <span>公開試用・唔會真收款 · Public demo — no real payments</span>
</footer>
<script src="assets/config.js?v=2"></script>
<script src="assets/i18n.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="assets/app.js?v=2"></script>
</body>
</html>
